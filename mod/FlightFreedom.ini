; Flight Freedom for Crimson Desert 2.03.00 (exe 1.0.0.2944)
; Put FlightFreedom.asi and this file in bin64 next to CrimsonDesert.exe,
; with an ASI loader (Ultimate ASI Loader as winmm.dll). The plugin writes
; FlightFreedom.log next to itself and says exactly what it changed.

[settings]
; The flying ceiling. The game ships 1350.0 on Blackstar and the Wyvern and
; no ceiling on every other mount; this is written over the loaded table at
; startup and read back.
;   0        leave the game's 1350.0
;   -1       no ceiling
;   <number> that height, e.g. 5000
Ceiling=-1

; Regions carry a block list of mount categories. When you fly into a region
; that lists your mount you are dismounted (that is what happens at roughly
; 1550 up), and a ride into it is refused. The same list is what refuses a
; summon inside the Abyss. With this on, the routine that consults the list
; answers "not blocked" everywhere.
;   0  regions keep their block lists
;   1  no region blocks any mount
NoFlyZones=1

; The summon validator's own region refusal ("Cannot summon in this area.").
; Redundant while NoFlyZones is 1; kept separate so summoning in the Abyss
; still works if you turn NoFlyZones off to keep the dismount zones.
;   0  the validator can refuse for the region
;   1  it never does
AbyssSummon=1

; Summoning while standing on something the game has flagged as a platform.
; The validator looks up whatever is underfoot, finds its row and refuses with
; "Cannot summon here." NumboOne0990 reports exactly that on the Abyss Nexus
; teleport circles, where walking a few paces off the circle is enough to make
; the summon work. Off by default: the reading comes from the disassembly and
; one report rather than from a played test, and turning it on also lets a
; mount be summoned onto a moving platform anywhere in the game.
;   0  the validator can refuse for what you are standing on
;   1  it never does
PlatformSummon=0

; Flying low over a town, off the road, dismounts you with "Cannot ride the
; mount in town." The rule is "in town and not above a road within 20", and it
; is separate from the region block list above. This makes the road half always
; answer yes, so the rule can never be true. It reaches one condition row in
; the game and nothing else; the in-town test itself is left alone, because 23
; other rows use it for bounty escalation and trade pricing.
;   0  the game's own behaviour
;   1  flying over towns never dismounts you
TownFlight=1

; Blackstar leaves a while after you get off it, where the Wyvern stays put.
; A called mount stays out for its spawn duration in characterinfo: 600 on
; Blackstar and 0 on the Wyvern, and 0 is what lets the Wyvern stay. This gives
; Blackstar the Wyvern's 0. Requested by ShawX99.
;   0  the game's own spawn duration, so Blackstar lifts off again
;   1  Blackstar stays where you leave it
; This replaces LandedTimeout, which is retired and ignored: it wrote a field
; that turned out to be Blackstar's ground-check distance.
BlackstarStays=1

; Research mode. Hooks every mount-related condition, reads the [sites],
; [patch] and [watch] sections below, and enables the two overrides under it.
; Not needed for the mod to work. The log becomes large.
;   0  off
;   1  on
Probe=0

; Only with Probe=1: answer a region refusal above this height "allowed"
; (0 off, -1 any height, >0 that height). NoFlyZones=1 makes it moot.
AboveCeiling=0

; Only with Probe=1: answer a refusing summon gate condition "allowed". Do
; not use it as a fix: with a mount already out it forces the mount's ground
; check to yes and you get "Cannot summon mount while it's on the ground".
SummonAnywhere=0

; ---------------------------------------------------------------------------
; Research sections, read only with Probe=1.
;
; [sites]  name = 0xRVA [, ret=0xN] [, skip=0xN] [, after=N] [, dump=N] [, lines=N]
;                       [, stack=N] [, leave=0|1] [, args=N] [, obj=0xN]
;                       [, out=N] [, retobj=0xN] [, a1=0xN .. a4=0xN]
;   Hooks the function at that RVA and logs every call: caller, arguments,
;   xmm floats, return value, an out-pointer readback (out=), the returned
;   object (retobj=), and a caller unwind. ret= replaces the return value,
;   skip= returns it without running the function, a1= to a4= replace
;   rcx/rdx/r8/r9 on entry; after=N holds every replacement back until the
;   function has been called N times. leave=0 turns the return hook off.
; [patch]  name = 0xRVA : hex bytes        written at startup, restored on unload
; [watch]  name = 0xRVA , length           logged at startup and on every change
;
; The full set used to find the two patches is in the repository under
; private/research/FlightProbe-full-probe-0.15.1.ini.
[sites]

[patch]

[watch]
